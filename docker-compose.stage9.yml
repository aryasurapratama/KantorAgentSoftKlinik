services:
  office:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
    volumes:
      - office-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [office]
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      office: { condition: service_healthy }
    ports: ["127.0.0.1:8787:80"]
    volumes:
      - ./deploy/nginx.stage9.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [office]
volumes:
  office-data:
networks:
  office:
